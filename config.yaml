target_role: "AI / Machine Learning Engineer"
target_city: "Bengaluru"
keywords:
  - "AI Engineer"
  - "Machine Learning Engineer"
  - "Data Scientist"
  - "Junior ML Engineer"
  - "LLMs"
  - "Transformers"
  - "Computer Vision"
  - "NLP"
  - "MLOps"
  - "LangChain"
  - "PyTorch"
  - "Deep Learning"
  - "Remote"
  - "Hyderabad"
my_skills:
  - "Python"
  - "PyTorch"
  - "Scikit-Learn"
  - "Pandas"
  - "NumPy"
  - "Deep Learning"
  - "SQL"
  - "Docker"
  - "Git"
  - "Machine Learning"
experience_years: 1
db_path: "edgedash.db"
min_fit_score: 70

sources:
  - "arbeitnow"
  # - "apify"  # Note: requires APIFY_TOKEN set in .env
use_mock_fetcher: false

# LLM Configuration (Rule 15)
llm_provider: "gemini"
llm_model: "gemini-3.1-flash-lite"

# Scoring Settings (Rule 16 & Rule 21)
target_seniority: "junior"
score_batch_size: 25
scoring_weights:
  skill_match: 0.45
  seniority_fit: 0.25
  location_fit: 0.15
  recency: 0.15

# ==============================================================================
# SKILL ALIASES MAP (Rule 23)
# This map is MINE to edit and curate. Adding entries is expected as I see my own
# data from `python -m edgedash.skills --audit`.
# Never auto-merge skill names by model judgement or string similarity alone.
# ==============================================================================
skill_aliases:
  k8s: "kubernetes"
  kubernetes: "kubernetes"

  # Keep node separate from javascript — they are different skills
  js: "javascript"
  javascript: "javascript"
  node: "nodejs"
  nodejs: "nodejs"
  node.js: "nodejs"
  "node js": "nodejs"

  postgres: "postgres"
  postgresql: "postgres"
  psql: "postgres"

  gcp: "gcp"
  google cloud: "gcp"
  google cloud platform: "gcp"

  ml: "machine learning"
  machine learning: "machine learning"

  ci/cd: "ci/cd"
  ci cd: "ci/cd"
  cicd: "ci/cd"
  ci-cd: "ci/cd"

  # Common data/software roles
  ts: "typescript"
  typescript: "typescript"
  py: "python"
  python: "python"
  sklearn: "scikit-learn"
  scikit-learn: "scikit-learn"
  scikitlearn: "scikit-learn"
  "scikit learn": "scikit-learn"
  aws: "aws"
  amazon web services: "aws"
  azure: "azure"
  microsoft azure: "azure"
  docker: "docker"
  git: "git"
  sql: "sql"
  pandas: "pandas"
  numpy: "numpy"
  pytorch: "pytorch"
  tensorflow: "tensorflow"
  tf: "tensorflow"


# ==============================================================================
# VERIFICATION THRESHOLDS (Rule 39)
# Every threshold below guards against a specific pipeline failure mode.
# ==============================================================================

# Catches score inflation/compression: fails if max-min score spread < 10
min_score_spread: 10.0

# Catches uniform score clustering: fails if score standard deviation < 5
min_score_stdev: 5.0

# Catches broken extractor returning empty required skills: fails if > 20% empty
max_empty_extraction_pct: 0.20

# Catches prompt explosion/hallucinated sentence dump: fails if listing has > 20 skills
max_skills_per_listing: 20

# Catches ranking a rumour: fails if top-ranked gap has < 3 listings
min_gap_sample: 3

# Catches stale pipeline ingestion: fails if newest fetched listing is > 3 days old
max_data_age_days: 3.0
