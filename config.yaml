target_role: "AI / Machine Learning Engineer"
target_city: "Bengaluru"
keywords:
  - "AI Engineer"
  - "Machine Learning Engineer"
  - "Data Scientist"
  - "Junior ML Engineer"
  - "LLMs"
  - "Transformers"
  - "Computer Vision"
  - "NLP"
  - "MLOps"
  - "LangChain"
  - "PyTorch"
  - "Deep Learning"
  - "Remote"
  - "Hyderabad"
my_skills:
  - "Python"
  - "PyTorch"
  - "Scikit-Learn"
  - "Pandas"
  - "NumPy"
  - "Deep Learning"
  - "SQL"
  - "Docker"
  - "Git"
  - "Machine Learning"
experience_years: 1
db_path: "edgedash.db"
min_fit_score: 70

sources:
  - "arbeitnow"
  # - "apify"  # Note: requires APIFY_TOKEN set in .env
use_mock_fetcher: false

# LLM Configuration (Rule 15)
llm_provider: "gemini"
llm_model: "gemini-3.1-flash-lite"

# Scoring Settings (Rule 16 & Rule 21)
target_seniority: "junior"
score_batch_size: 25
scoring_weights:
  skill_match: 0.45
  seniority_fit: 0.25
  location_fit: 0.15
  recency: 0.15
